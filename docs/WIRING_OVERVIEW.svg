<rect width="1400" height="850" fill="#f5f8f4"/><rect x="0" y="0" width="1400" height="112" fill="#10382b"/>
<text x="55" y="51" font-family="Arial" font-size="34" fill="#fff" font-weight="bold">MatiPulse | Low-voltage hardware overview</text>
<text x="55" y="80" font-family="Arial" font-size="17" fill="#a9d9be">Preliminary pin-and-module diagram · design only · not a certified circuit schematic</text>
<rect x="520" y="220" width="360" height="375" rx="22" fill="#154a36" filter="url(#shadow)"/><text x="700" y="285" fill="#fff" font-size="31" font-weight="bold" text-anchor="middle" font-family="Arial">ESP32 DevKit V1</text><text x="700" y="317" fill="#b6ebc8" font-size="17" text-anchor="middle" font-family="Arial">3.3 V logic • ADC1 GPIO34</text>
<g font-family="Arial" font-size="17" fill="#e5fff0"><text x="545" y="382">GPIO34 ← soil AO</text><text x="545" y="434">GPIO4 ← DHT11 DATA</text><text x="545" y="486">GPIO27 ← float input</text><text x="545" y="538">GPIO26 → driver IN</text></g>
<rect x="53" y="220" width="385" height="113" rx="15" fill="#fff" stroke="#c2dfca" stroke-width="2"/><text x="77" y="265" fill="#1e5d42" font-family="Arial" font-weight="bold" font-size="23">Capacitive soil sensor</text><text x="77" y="296" fill="#597a66" font-family="Arial" font-size="17">AO → GPIO34  |  VCC 3.3 V</text>
<rect x="53" y="357" width="385" height="113" rx="15" fill="#fff" stroke="#c2dfca" stroke-width="2"/><text x="77" y="402" fill="#1e5d42" font-family="Arial" font-weight="bold" font-size="23">DHT11 temperature / RH</text><text x="77" y="433" fill="#597a66" font-family="Arial" font-size="17">DATA → GPIO4  |  suitable pull-up</text>
<rect x="53" y="495" width="385" height="113" rx="15" fill="#fff" stroke="#c2dfca" stroke-width="2"/><text x="77" y="539" fill="#1e5d42" font-family="Arial" font-weight="bold" font-size="23">Water tank float switch</text><text x="77" y="570" fill="#597a66" font-family="Arial" font-size="17">GPIO27 → GND when water present</text>
<rect x="963" y="220" width="385" height="113" rx="15" fill="#fff" stroke="#c2dfca" stroke-width="2"/><text x="985" y="265" fill="#1e5d42" font-family="Arial" font-weight="bold" font-size="23">MOSFET driver module</text><text x="985" y="296" fill="#597a66" font-family="Arial" font-size="17">GPIO26 controls 3.3 V logic input</text>
<rect x="963" y="375" width="385" height="113" rx="15" fill="#fff" stroke="#c2dfca" stroke-width="2"/><text x="985" y="421" fill="#1e5d42" font-family="Arial" font-weight="bold" font-size="23">Low-voltage DC pump</text><text x="985" y="451" fill="#597a66" font-family="Arial" font-size="17">5 V example · driver-rated stall current</text>
<rect x="963" y="529" width="385" height="113" rx="15" fill="#fff" stroke="#e4ca85" stroke-width="2"/><text x="985" y="573" fill="#865e24" font-family="Arial" font-weight="bold" font-size="23">Separate regulated supply</text><text x="985" y="604" fill="#8c734e" font-family="Arial" font-size="17">5 V for pump · appropriate current rating</text>
<g stroke="#4d8f70" stroke-width="4" fill="none" marker-end="url(#arr)"><path d="M438 280 H520"/><path d="M438 414 H520"/><path d="M438 550 H520"/><path d="M880 535 H922 V275 H963"/><path d="M1155 333 V375"/><path d="M1155 529 V488"/></g>
<rect x="52" y="687" width="1296" height="115" rx="15" fill="#fff6e5" stroke="#ebcf89"/><text x="74" y="724" font-family="Arial" font-weight="bold" font-size="19" fill="#8c652b">⚠  CRITICAL ELECTRICAL NOTES</text><text x="74" y="758" font-family="Arial" font-size="17" fill="#7b693d">Never power a pump from an ESP32 GPIO. Use flyback protection, rated driver, and compatible common low-voltage ground.</text><text x="74" y="783" font-family="Arial" font-size="17" fill="#7b693d">Add a physical power-cut emergency switch. Verify float polarity, ADC voltage and MOSFET wiring before any pump test.</text>
